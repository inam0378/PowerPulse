/* Layout: operator shell — black sidebar + working canvas; billing = item wall left, ticket right; phone = stacked with bottom nav */
:root{
  --bg:#0c0b09; --panel:#16150f; --panel2:#201e16; --line:#2e2b20; --fg:#f5f1e3; --muted:#a59f88;

  --f-display:"Poppins",system-ui,"Segoe UI",sans-serif;

  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px}

.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}

.tile{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:118px;transition:transform .08s,border-color .1s}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.quick{display:flex;gap:6px;flex-wrap:wrap}
.change{font-family:var(--f-display);font-size:30px;font-weight:700}

/* receipt */
.rc{background:#fff;color:#000;font-family:var(--f-mono);font-size:12px;padding:14px 12px;margin:0 auto;line-height:1.45}

@media print{
  @page{margin:0}
  body *{visibility:hidden}

  .rc{width:auto !important;padding:4mm}

async function rpc(fn,args){

    const m=res.error.message||"Something went wrong";
    if(/PLAN_REQUIRED/.test(m)&&TOKEN){setTimeout(enter,0);throw new Error(m.replace("PLAN_REQUIRED: ",""))}

async function api(path,method="GET",body){

    if(path==="/api/users"&&method==="GET")return S.users.map(u=>({id:u.id,name:u.name,login:u.login,role:u.role,active:u.active}));
    if(path==="/api/users"&&method==="POST"){
      if(!/^[a-z0-9._-]{3,30}$/.test(body.login))throw new Error("Username must be 3 to 30 characters (a-z, 0-9, . _ -).");
      if((body.password||"").length<6)throw new Error("Password must be at least 6 characters.");
      if(S.users.some(u=>u.login===body.login))throw new Error("This username is already taken.");
      S.users.push({id:uid(),name:body.name||body.login,login:body.login,password:body.password,role:body.role==="manager"?"manager":"cashier",active:true});saveLocal();return{ok:true}}
    if((m=path.match(/^\/api\/users\/([\w-]+)\/active$/))){const u=S.users.find(x=>x.id===m[1]);if(u&&u.role!=="owner")u.active=!!body.active;saveLocal();return{ok:true}}
    if((m=path.match(/^\/api\/users\/([\w-]+)\/password$/))){if((body.password||"").length<6)throw new Error("Password must be at least 6 characters.");const u=S.users.find(x=>x.id===m[1]);if(u)u.password=body.password;saveLocal();return{ok:true}}
  }
  if(path==="/api/state")return rpc("get_state");
  if(path==="/api/me")return rpc("me");
  if(path==="/api/orders")return rpc("create_order",{p:body});
  if((m=path.match(/^\/api\/orders\/(\d+)\/void$/)))return rpc("void_order",{p_no:+m[1],p_reason:body.reason});
  if(path==="/api/items"&&method==="POST")return rpc("save_item",{p:{...body,id:isUuid(body.id)?body.id:""}});
  if((m=path.match(/^\/api\/items\/([\w-]+)\/restock$/)))return rpc("restock",{p_id:m[1],p_qty:body.qty});
  if((m=path.match(/^\/api\/items\/([\w-]+)$/))&&method==="DELETE")return rpc("delete_item",{p_id:m[1]});
  if(path==="/api/settings")return rpc("save_settings",{p:body});
  if(path==="/api/users"&&method==="GET")return rpc("list_staff");
  if(path==="/api/users"&&method==="POST")return rpc("staff_create",{p_name:body.name,p_username:body.login,p_password:body.password,p_role:body.role});
  if((m=path.match(/^\/api\/users\/([\w-]+)\/password$/)))return rpc("staff_set_password",{p_user:m[1],p_password:body.password});
  if((m=path.match(/^\/api\/users\/([\w-]+)\/active$/)))return rpc("set_staff_active",{p_user:m[1],p_active:!!body.active});
  if(path==="/api/billing/request")return rpc("request_payment",{p_plan:body.plan_id,p_method:body.method,p_txn:body.txn,p_sender:body.sender||""});
  if(path==="/api/logout"){await SB.auth.signOut();return{}}
  throw new Error("Unknown "+path);
}

function heldModal(){
  const o=modal(`<h2>Held orders</h2><p class="muted" style="margin-top:-6px">Held orders stay on this device only.</p>${S.held.map((h,i)=>{const t=calcOrder({lines:h.cart.lines,disc:h.cart.disc,discType:h.cart.discType,pay:h.cart.pay,type:h.cart.type},S.settings,{items:S.items});return `<div class="top-item"><div><b>${h.cart.type}</b> · ${h.cart.lines.length} item${h.cart.lines.length==1?"":"s"}<div class="muted">${new Date(h.ts).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"})} ${esc(h.cart.cust.name)}</div></div><div class="row"><b class="num">${pkr(t.total)}</b><button class="btn sm y" data-r="${i}">Resume</button></div></div>`}).join("")}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn" id="x">Close</button></div>`);
  o.querySelector("#x").onclick=close;
  o.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{if(UI.cart.lines.length)S.held.push({id:uid(),ts:Date.now(),cart:UI.cart});UI.cart=S.held.splice(+b.dataset.r,1)[0].cart;saveHeld();close();renderCart()});
}
function payModal(){
  const c=UI.cart,t=cartTotals();
  if(c.type==="Delivery"&&!c.cust.phone.trim()){toast("Enter a phone number for delivery",true);$("#cphone").focus();return}
  if(OFFLINE&&c.type==="Dine-in"){if(!c.table){toast("Choose the table number",true);$("#ctable").focus();return}
    if(!c.waiterId||!activeWaiters().some(w=>w.id===c.waiterId)){c.waiterId="";toast("Choose the waiter",true);$("#cwaiter").focus();return}}
  const qs=[t.total,...[500,1000,2000,5000].filter(x=>x>t.total)].slice(0,4);
  const o=modal(`<h2>Payment · ${PAYL[c.pay]||"Cash"}</h2>
   <div class="sum" style="font-size:16px;margin-bottom:12px"><span>Total</span><b class="num">${pkr(t.total)}</b></div>
   ${c.pay==="cash"?`<label class="f">Cash received (PKR)<input class="in num" id="recv" inputmode="decimal" autofocus value="${t.total}"></label>
   <div class="quick" style="margin:10px 0">${qs.map(q=>`<button class="btn sm" data-qk="${q}">${q.toLocaleString()}</button>`).join("")}</div>
   <div class="muted">Change</div><div class="change num" id="chg">PKR 0</div>`:`<p class="muted">Press Confirm only after the ${c.pay==="card"?"card machine / QR":c.pay==="wallet"?"JazzCash / Easypaisa app":"bank app"} shows the payment as successful. This software does not check payments with the bank or wallet.</p><label class="f">${c.pay==="card"?"Reference / last 4 digits":"Transaction ID"} (optional)<input class="in" id="ref" autofocus maxlength="30"></label>`}
   <p id="perr" style="color:var(--bad);min-height:18px"></p>
   <div class="row" style="justify-content:flex-end"><button class="btn" id="x">Back</button><button class="btn y" id="ok">Confirm &amp; receipt</button></div>`);
  const recv=o.querySelector("#recv"),ok=o.querySelector("#ok");
  const upd=()=>{const ch=(+recv.value||0)-t.total;o.querySelector("#chg").textContent=ch>=0?pkr(ch):"Short by: "+pkr(-ch);ok.disabled=ch<0};
  if(recv){recv.oninput=upd;upd();recv.select();o.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{recv.value=b.dataset.qk;upd()})}
  o.querySelector("#x").onclick=close;
  ok.onclick=()=>busy(ok,async()=>{
    try{const ord=await DO.order(c,recv?{cash:+recv.value}:{ref:o.querySelector("#ref").value});
      UI.cart=newCart();close();renderGrid();renderCart();receipt(ord);
    }catch(e){o.querySelector("#perr").textContent=e.message}
  });
  o.addEventListener("keydown",e=>{if(e.key==="Enter"&&!ok.disabled&&e.target.tagName!=="BUTTON"){e.preventDefault();ok.click()}});
}

/* ============ kitchen screen ============ */
let KTIMER=null,KSEEN=null,KAUDIO=null,KSHOWDONE=false;
function kBeep(){try{if(!KAUDIO)return;const o=KAUDIO.createOscillator(),g=KAUDIO.createGain();o.connect(g);g.connect(KAUDIO.destination);o.frequency.value=880;g.gain.value=.25;o.start();setTimeout(()=>{o.frequency.value=1320},180);setTimeout(()=>o.stop(),420)}catch(e){}}
function vKitchen(){
  clearInterval(KTIMER);
  const now=Date.now(),open=S.orders.filter(o=>o.status!=="void"&&!o.kdone&&now-o.ts<12*36e5).sort((a,b)=>a.ts-b.ts);
  const done=S.orders.filter(o=>o.status!=="void"&&o.kdone&&now-o.ts<12*36e5).sort((a,b)=>b.kdone-a.kdone).slice(0,8);
  const ids=new Set(open.map(o=>o.id));if(KSEEN&&[...ids].some(id=>!KSEEN.has(id)))kBeep();KSEEN=ids;
  const age=o=>Math.max(0,Math.floor((now-o.ts)/6e4));
  const card=(o,d)=>`<div class="kcard ${d?"done":age(o)>=15?"late":age(o)>=8?"warn":""}"><div class="kh"><b class="num">${ono(o.no)}${o.table?` · ${esc(o.table)}`:""}</b><span class="muted">${esc(o.type)} · ${d?"done":age(o)+" min"}</span></div>${o.waiter?`<div class="muted" style="font-size:12px">Waiter: ${esc(o.waiter)}</div>`:""}
    ${o.cust&&o.cust.name?`<div class="muted" style="font-size:12px">${esc(o.cust.name)}</div>`:""}
    ${o.lines.map(l=>`<div class="kl">${l.qty} × ${esc(l.name)}${(l.parts||[]).length?`<small>${l.parts.map(p=>p.qty*l.qty+"× "+esc(p.name)).join(" · ")}</small>`:""}${modsHTML(l)}</div>`).join("")}
    ${(o.free||[]).map(f=>`<div class="kl">${f.qty} × ${esc(f.name)} <small>free</small></div>`).join("")}
    ${d?`<button class="btn sm" data-kundo="${o.no}">Undo</button>`:`<button class="btn y" data-kdone="${o.no}" style="width:100%">Done</button>`}</div>`;
  $("#view").innerHTML=`<div class="row" style="justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px"><div><b style="font-size:18px">${open.length} order${open.length==1?"":"s"} to make</b> <span class="muted">· new orders appear by themselves</span></div>
    <div class="row" style="gap:6px">${KAUDIO?`<span class="pill ok">Sound on</span>`:`<button class="btn sm" id="ksnd">🔔 Turn on sound</button>`}<button class="btn sm" id="kdn">${KSHOWDONE?"Hide done":"Show done"}</button></div></div>
    ${open.length?`<div class="kgrid">${open.map(o=>card(o,false)).join("")}</div>`:`<div class="card empty" style="padding:40px;text-align:center">No orders waiting</div>`}
    ${KSHOWDONE&&done.length?`<h3 style="margin-top:18px">Recently done</h3><div class="kgrid">${done.map(o=>card(o,true)).join("")}</div>`:""}`;
  const sb=$("#ksnd");sb&&(sb.onclick=()=>{try{KAUDIO=new (window.AudioContext||window.webkitAudioContext)();KAUDIO.resume();kBeep()}catch(e){toast("Sound is not available on this device",true)}vKitchen()});
  $("#kdn").onclick=()=>{KSHOWDONE=!KSHOWDONE;vKitchen()};
  $("#view").querySelectorAll("[data-kdone]").forEach(b=>b.onclick=()=>busy(b,async()=>{await DO.kitchenDone(b.dataset.kdone);if(UI.view==="kitchen")vKitchen()}));
  $("#view").querySelectorAll("[data-kundo]").forEach(b=>b.onclick=()=>busy(b,async()=>{await DO.kitchenDone(b.dataset.kundo,true);if(UI.view==="kitchen")vKitchen()}));
  KTIMER=setInterval(()=>{if(UI.view==="kitchen"&&$("#view")&&!$("#ov"))vKitchen();else clearInterval(KTIMER)},30000);
}

const tsortT=(a,b)=>{const x=+String(a).replace(/\D+/g,""),y=+String(b).replace(/\D+/g,"");return x&&y&&x!==y?x-y:String(a).localeCompare(String(b))};

  else if(rep.breakdown.kind==="days")tbl=`<h3>Daily breakdown</h3><div class="rt"><table><thead><tr><th>Date</th><th class="r">Orders</th><th class="r">Gross sales</th><th class="r">Refunds</th><th class="r">Net revenue</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${dl(x.day)}</td><td class="r">${n(x.orders)}</td><td class="r">${n(x.gross)}</td><td class="r">${n(x.refunds)}</td><td class="r">${n(x.net)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${n(sum("orders"))}</td><td class="r">${n(sum("gross"))}</td><td class="r">${n(sum("refunds"))}</td><td class="r">${n(sum("net"))}</td></tr></tfoot></table></div>`;
  else tbl=`<h3>Monthly breakdown</h3><div class="rt"><table><thead><tr><th>Month</th><th class="r">Orders</th><th class="r">Tax</th><th class="r">Discounts</th><th class="r">Net revenue</th></tr></thead><tbody>
    ${rows.map(x=>`<tr><td>${ml(x.month)}</td><td class="r">${n(x.orders)}</td><td class="r">${n(x.tax)}</td><td class="r">${n(x.discount)}</td><td class="r">${n(x.net)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${n(sum("orders"))}</td><td class="r">${n(sum("tax"))}</td><td class="r">${n(sum("discount"))}</td><td class="r">${n(sum("net"))}</td></tr></tfoot></table></div>`;
  const pt=rep.payments.reduce((a,x)=>a+x.amount,0),pc=rep.payments.reduce((a,x)=>a+x.orders,0);
  const pay=rep.payments.length?`<h3>Payment methods</h3><div class="rt"><table><thead><tr><th>Method</th><th class="r">Orders</th><th class="r">Share</th><th class="r">Amount</th></tr></thead><tbody>
    ${rep.payments.map(x=>`<tr><td>${esc(x.method)}</td><td class="r">${n(x.orders)}</td><td class="r">${pt?Math.round(x.amount/pt*1000)/10:0}%</td><td class="r">${n(x.amount)}</td></tr>`).join("")}</tbody>
    <tfoot><tr><td>Total</td><td class="r">${n(pc)}</td><td class="r">100%</td><td class="r">${n(pt)}</td></tr></tfoot></table></div>`:"";
  const W=rep.waiters||[],wsum=W.reduce((a,x)=>a+x.sales,0),wcnt=W.reduce((a,x)=>a+x.orders,0);
  const wt=W.length?`<h3>Sales by waiter (Dine-In)</h3><div class="rt"><table><thead><tr><th>Waiter</th><th class="r">Orders</th><th class="r">Total sales</th><th>Tables served</th></tr></thead><tbody>
    ${W.map(x=>`<tr><td>${esc(x.waiter)}</td><td class="r">${n(x.orders)}</td><td class="r">${n(x.sales)}</td><td class="it">${x.tables.map(esc).join(", ")}</td></tr>`).join("")}</tbody>

  return `<div class="rpaper"><div class="rh"><div style="min-width:0"><h2>${esc(b.name||"")}</h2><div class="mut">${esc([b.address,b.phone].filter(Boolean).join(" · "))}</div></div><span class="badge">${{daily:"DAILY",monthly:"MONTHLY",yearly:"YEARLY",custom:"CUSTOM RANGE"}[rep.mode]}</span></div><hr>

    <div class="rkc"><div class="l">Discounts &amp; tax</div><div class="v">${P(k.discount)}</div><div class="s">tax ${P(k.tax)}</div></div>
    <div class="rkc hl"><div class="l">Net revenue</div><div class="v">${P(k.net)}</div><div class="s">completed orders</div></div>
    <div class="rkc"><div class="l">Total orders</div><div class="v">${n(k.orders)}</div><div class="s ${k.refunds?"bad":""}">${k.refunds?`${n(k.refunds)} refunded · ${P(k.refunded)}`:"no refunds"}</div></div></div>
   ${tbl}${wt}${pay}</div>`;
}
async function exportReport(){
  const q=new URLSearchParams(repQuery());
  let r;try{r=await fetch("/api/report.pdf?"+q,{headers:{Authorization:"Bearer "+offTok()}})}catch(e){return toast("Cannot reach the counter PC",true)}
  if(!r.ok){const j=await r.json().catch(()=>({}));return toast((j.error&&(j.error.message||j.error))||"Could not make the PDF",true)}
  const name=r.headers.get("X-Filename")||"Sales_Report.pdf",blob=await r.blob(),a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000);
  toast("Saved to Downloads: "+name);
}

/* ============ orders ============ */
function vOrders(){
  const r=UI.range;const tk=dayKey(Date.now()),wk=Date.now()-7*864e5;
  const list=S.orders.filter(o=>r==="all"||(r==="today"?dayKey(o.ts)===tk:o.ts>wk)).slice().reverse();
  const tot=list.filter(o=>o.status==="paid").reduce((s,o)=>s+o.total,0);const prof=list.filter(o=>o.status==="paid").reduce((s,o)=>s+o.total-o.tax-(o.fee||0)-(o.cost||0),0);
  $("#view").innerHTML=`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px"><div class="seg" id="rng" style="min-width:240px">${[["today","Today"],["week","7 days"],["all","All"]].map(([k,l])=>`<button class="${r===k?"on":""}" data-v="${k}">${l}</button>`).join("")}</div><b class="num">${list.length} orders · ${pkr(tot)}${canProfit()?` · profit ${pkr(prof)}`:""}</b></div>
  <div class="tbl-wrap"><table><tr><th>Order</th><th>Time</th><th>Type</th><th>Table #</th><th>Waiter</th><th>Items</th><th>Payment</th><th>Cashier</th><th class="r">Total</th>${canProfit()?`<th class="r">Profit</th>`:""}<th>Status</th><th></th></tr>
  ${list.map(o=>`<tr><td><b>${ono(o.no)}</b>${o.demo?' <span class="pill y">demo</span>':""}</td><td class="muted">${new Date(o.ts).toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}</td><td>${o.type}</td><td>${o.type==="Dine-in"&&o.table?esc(o.table):`<span class="muted">—</span>`}</td><td>${o.type==="Dine-in"&&o.waiter?esc(o.waiter):`<span class="muted">—</span>`}</td><td>${o.lines.reduce((a,l)=>a+l.qty,0)}</td><td>${PAYL[o.pay]||"Cash"}</td><td class="muted">${esc(o.by)}</td><td class="r num">${pkr(o.total)}</td>${canProfit()?`<td class="r num muted">${o.status==="paid"?pkr(o.total-o.tax-(o.fee||0)-(o.cost||0)):"—"}</td>`:""}<td><span class="pill ${o.status==="paid"?"ok":"bad"}" title="${esc(o.voidReason||"")}">${o.status==="paid"?"Paid":"Void"}</span></td><td><button class="btn sm" data-rc="${o.no}">Receipt</button> ${UI.role!=="cashier"&&o.status==="paid"?`<button class="btn sm bad" data-void="${o.no}">Void</button>`:""}</td></tr>`).join("")||`<tr><td colspan="11" class="empty">No orders in this period</td></tr>`}</table></div></div>`;
  $("#rng").querySelectorAll("button").forEach(b=>b.onclick=()=>{UI.range=b.dataset.v;vOrders()});
  document.querySelectorAll("[data-rc]").forEach(b=>b.onclick=()=>receipt(S.orders.find(o=>o.no==b.dataset.rc)));
  document.querySelectorAll("[data-void]").forEach(b=>b.onclick=()=>{const o=S.orders.find(x=>x.no==b.dataset.void);
    const m=modal(`<h2>Void ${ono(o.no)}?</h2><p class="muted">This order is ${pkr(o.total)}. Voiding removes the sale from reports and puts the stock back.</p><label class="f">Reason<input class="in" id="why" autofocus placeholder="e.g. wrong item"></label><p id="verr" style="color:var(--bad);min-height:18px"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="x">No</button><button class="btn y" id="ok">Yes, void it</button></div>`);
    m.querySelector("#x").onclick=close;const ok=m.querySelector("#ok");
    ok.onclick=()=>busy(ok,async()=>{const why=m.querySelector("#why").value.trim();if(!why){m.querySelector("#verr").textContent="Please enter a reason.";return}await DO.voidOrder(o.no,why);close();vOrders();toast("Order void")})});
}

function itemForm(it,preset){

  const cats=[...new Set(S.items.map(i=>i.cat))];const sz=(it.sizes||[]).concat([{l:"",p:""},{l:"",p:""},{l:"",p:""}]).slice(0,Math.max(3,(it.sizes||[]).length));const ad=(it.addons||[]).concat([{l:"",p:""},{l:"",p:""},{l:"",p:""}]).slice(0,Math.max(3,(it.addons||[]).length+1));const cm=(it.components||[]).concat([{},{},{},{}]).slice(0,Math.max(4,(it.components||[]).length+1));const ig=(it.ingr||[]).concat([{n:"",x:""},{n:"",x:""},{n:"",x:""},{n:"",x:""}]).slice(0,Math.max(4,(it.ingr||[]).length+2));

   <label class="f">Barcode (packed items)<input class="in" id="i_bar" value="${esc(it.barcode)}" placeholder="Scan with the scanner"></label>

    <div style="display:grid;gap:6px">${ad.map((a,k)=>`<div class="addrow"><input class="in" id="a_l${k}" placeholder="Add-on" value="${esc(a.l)}"><input class="in" id="a_p${k}" type="number" min="0" placeholder="+ Rate" value="${a.p}"></div>`).join("")}</div></div>
   <div class="full"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Ingredients the customer can change (Onion, Tomato, Mayo…) · "Extra" rate is charged when the customer asks for extra · leave 0 for free</div>
    <div style="display:grid;gap:6px" id="igrows">${ig.map((g,k)=>`<div class="addrow"><input class="in" id="g_n${k}" placeholder="Ingredient" value="${esc(g.n)}" maxlength="30"><input class="in" id="g_x${k}" type="number" min="0" placeholder="Extra Rs" value="${g.x===""?"":g.x}"></div>`).join("")}</div>
    <button type="button" class="btn sm" id="g_more" style="margin-top:6px">+ More ingredients</button></div>
   ${canProfit()?`<div class="full card" style="background:var(--bg)"><h3 style="font-size:16px">Cost price <span class="pill y">visible only to you</span></h3>
    <div class="fgrid"><label class="f">Cost · if only one size<input class="in" id="i_cost" type="number" min="0" value="${it.cost??""}" placeholder="Rs"></label>
    ${sz.map((z,k)=>`<label class="f">Cost · size ${k+1}<input class="in" id="zc${k}" type="number" min="0" value="${z.l&&it.sizeCosts&&it.sizeCosts[z.l]!=null?it.sizeCosts[z.l]:""}" placeholder="Cost of size ${k+1} above"></label>`).join("")}</div>

  cm.forEach((_,k)=>{fillSz(k);m.querySelector("#c_i"+k).onchange=()=>{m.querySelector("#c_s"+k).value="";m.querySelector("#c_s"+k).dataset.sel="";fillSz(k)}});
  const d=m.querySelector("#del");d&&(d.onclick=()=>{if(d.dataset.sure){busy(d,async()=>{await DO.delItem(it.id);close();vMenu();toast("Item deleted")})}else{d.dataset.sure=1;d.textContent="Delete for sure?"}});

  };
}

/* RestoPulse: turn OCR text of a menu photo into items. Owner checks the list before it is saved. */
const MENU_CAT_WORDS = ["pizza","pizzas","burger","burgers","wrap","wraps","roll","rolls","sandwich","sandwiches","shawarma","shawarmas","pasta","pastas","drink","drinks","beverage","beverages","deal","deals","combo","combos","side","sides","sided","starter","starters","starts","appetizer","appetizers","fries","bbq","karahi","handi","rice","biryani","dessert","desserts","sweet","sweets","shake","shakes","juice","juices","tea","coffee","chinese","soup","soups","salad","salads","breakfast","platter","platters","steak","steaks","wings","snack","snacks","special","specials","main","course","menu","extra","extras","add","ons","addons","naan","roti","bread","breads","broast","fried","chicken","grill","grilled","tikka","kabab","kebab","paratha","family","kids","hot","cold","ice","cream","&","/","and","+","our","item","items"];
const SIZE_WORDS = {s:"S",m:"M",l:"L",xl:"XL",small:"Small",medium:"Medium",large:"Large",regular:"Regular",reg:"Regular",half:"Half",full:"Full",single:"Single",double:"Double",quarter:"Quarter"};
function mpTitle(s){return s.toLowerCase().replace(/(^|[\s/&(+-])([a-z])/g,(a,b,c)=>b+c.toUpperCase()).replace(/\bAk47\b/gi,"AK47").replace(/\bBbq\b/g,"BBQ")}
function mpSizeHeader(line){
  // a row like "S M L", "Small Medium Large", "2pc 3pc", 7" 10" 13"
  const t=line.replace(/[^\w"'\s]/g," ").trim().split(/\s+/).filter(Boolean);
  if(t.length<2||t.length>5)return null;
  const out=[];
  for(const w of t){const lw=w.toLowerCase().replace(/['"]/g,"");
    if(SIZE_WORDS[lw])out.push(SIZE_WORDS[lw]);
    else if(/^\d{1,2}(pc|pcs|piece|pieces|"|inch|in|ml|ltr|l)$/i.test(w))out.push(w.replace(/pieces?$/i,"pc").replace(/pcs$/i,"pc"));
    else return null}
  return out.length>=2?out:null;
}
function mpIsCategory(name, hasPrice){
  const words=name.toLowerCase().replace(/[^a-z&/+ ]/g," ").split(/\s+/).filter(Boolean);
  if(!words.length||words.length>4)return false;
  const allCat=words.every(w=>MENU_CAT_WORDS.includes(w));
  const letters=name.replace(/[^A-Za-z]/g,"");
  const upper=letters.length>=3&&letters===letters.toUpperCase();
  const HEAD=["sided","starts","starters","sides","deals","drinks","beverages","extras","desserts","appetizers","burgers","pizzas","wraps","rolls","sandwiches","shakes","juices","soups","salads","snacks","specials","platters","steaks","combos","breads","sweets","menu"];
  if(allCat&&(upper||words.some(w=>HEAD.includes(w))))return true;
  if(!hasPrice&&upper&&words.length<=3)return true;
  return false;
}
function parseMenuText(text){
  const items=[];let cat="",sizes=null,pending=null;
  const lines=String(text).replace(/\r/g,"").split("\n");
  for(let raw of lines){
    let line=raw.replace(/[“”«»‘’]/g," ").replace(/\b(rs|pkr)\.?\s*/gi," ").replace(/(\d)\s*\/\s*-?/g,"$1 ").replace(/(\d),(?=\s|$)/g,"$1").replace(/\s+/g," ").trim();
    if(!line)continue;
    const sh=mpSizeHeader(line);if(sh){sizes=sh;continue}
    const tok=line.split(" ");
    // last token that is a real word (3+ letters, or letters+digits like 5Pc / AK47)
    let lw=-1;
    for(let i=0;i<tok.length;i++){const w=tok[i].replace(/^[^A-Za-z0-9(]+|[^A-Za-z0-9)]+$/g,"");
      if(/[A-Za-z]{3,}/.test(w)||/^AK\d+$/i.test(w)||/^\d+(pc|pcs|ml|ltr|l|kg|g)$/i.test(w)||/^\(.*\)$/.test(tok[i]))lw=i;}
    const head=lw>=0?tok.slice(0,lw+1).join(" "):"";
    const tail=lw>=0?tok.slice(lw+1):tok;
    const slots=[];
    for(const t of tail){const c=t.replace(/^[^\d-–—]+|[^\d]+$/g,"");
      if(/^[-–—]+$/.test(t.trim())){slots.push(null);continue}
      if(/^\d{2,5}$/.test(c)&&!/[A-Za-z]/.test(t)){const n=+c;if(n>=10&&n<=99999)slots.push(n)}}
    while(slots.length&&slots[0]===null&&slots.slice(1).every(x=>x===null))slots.shift();
    const prices=slots.filter(x=>x!==null);
    let name=head.replace(/^[^A-Za-z0-9(]+/,"").replace(/[^A-Za-z0-9)]+$/,"").replace(/\s+[^\sA-Za-z0-9()+&]+(?=\s|$)/g,"").trim();
    // OCR leaves short junk after the name ("Masala Fries Shy", "Roll P47"): drop it
    const KEEP=["dip","tea","hot","ice","egg","bun","pie","bbq","mix","veg","jam","cup","pc","ml","h","f"];
    let nt=name.split(" ");
    while(nt.length>1){const w=nt[nt.length-1];const lw2=w.toLowerCase().replace(/[^a-z0-9]/g,"");
      if(/\)$/.test(w)&&/\(/.test(nt.join(" ")))break;
      if((lw2.length<=3&&!KEEP.includes(lw2)&&!/^\d+(pc|ml|l)$/.test(lw2))||/^[a-z]{1,2}\d+\)?$/i.test(lw2)&&!/^ak\d+$/i.test(lw2)){nt.pop();continue}
      break}

    if(!prices.length){const lead=[];for(const w of name.split(" ")){if(w===w.toUpperCase()&&MENU_CAT_WORDS.includes(w.toLowerCase()))lead.push(w);else break}
      if(lead.length&&lead.join("").length>=3)name=lead.join(" ")}
    if(!name&&prices.length){ // price on its own line: belongs to the item above
      if(pending){pending.slots=slots;finish(pending);pending=null}
      continue}
    if(!name)continue;
    if(mpIsCategory(name,prices.length>0)){cat=mpTitle(name.replace(/[^A-Za-z&/ ]/g," ").replace(/\s+/g," ").trim());sizes=null;if(pending){items.push(pending);pending=null}continue}
    if(!prices.length){if(pending)items.push(pending);pending={name,cat,slots:[],sizesHint:sizes,noPrice:true};continue}
    if(pending){items.push(pending);pending=null}
    finish({name,cat,slots,sizesHint:sizes});
  }
  if(pending)items.push(pending);
  function finish(it){
    const s=it.slots;const real=s.filter(x=>x!==null);
    it.noPrice=!real.length;
    if(s.length===1||real.length===1&&!(it.sizesHint&&s.length===it.sizesHint.length)){it.price=real[0]||0;it.sizes=null}
    else if(real.length){
      const labels=it.sizesHint&&it.sizesHint.length===s.length?it.sizesHint:s.length===3?["S","M","L"]:s.length===2?["Regular","Large"]:s.map((_,k)=>"Size "+(k+1));
      it.sizes=s.map((p,k)=>p===null?null:{l:labels[k],p}).filter(Boolean);it.price=0}
    items.push(it);
  }
  const seen=new Set();
  return items.map(it=>({name:it.name.replace(/\s+/g," ").trim(),cat:it.cat||"Menu",price:it.price||0,sizes:it.sizes||null,ok:!it.noPrice}))
    .filter(it=>it.name.replace(/[^A-Za-z]/g,"").length>=3)
    .filter(it=>{const k=(it.name+"|"+it.price+"|"+JSON.stringify(it.sizes)).toLowerCase();if(seen.has(k))return false;seen.add(k);return true});
}

   <label class="f">From time<input class="in" id="o_from" type="time" value="${o.from||""}"></label>
   <label class="f">To time<input class="in" id="o_to" type="time" value="${o.to||""}"></label>
   <label class="f">From date<input class="in" id="o_st" type="date" value="${o.start||""}"></label>
   <label class="f">To date<input class="in" id="o_en" type="date" value="${o.end||""}"></label>
   <label class="f full" style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="o_on2" ${o.on!==false?"checked":""}> Offer is on</label>
   <p id="oerr" class="full" style="color:var(--bad);min-height:18px;margin:0"></p>
   <div class="full row" style="justify-content:space-between">${n?"<span></span>":`<button type="button" class="btn bad" id="o_del">Delete</button>`}<div class="row"><button type="button" class="btn" id="x">Back</button><button class="btn y" id="o_sv">Save</button></div></div></form>`);
  const q=x=>m.querySelector(x);q("#o_tp").value=o.type;q("#o_sc").value=o.scope||"bill";
  const fs=()=>{const x=S.items.find(i=>i.id===q("#o_fi").value);q("#o_fs").innerHTML=x&&x.sizes?x.sizes.map(z=>`<option ${z.l===o.free.size?"selected":""}>${esc(z.l)}</option>`).join(""):`<option value="">—</option>`};
  const sync=()=>{const t=q("#o_tp").value,sc=q("#o_sc").value;q("#o_vw").hidden=t==="free";q("#o_vw").firstChild.textContent=t==="pct"?"Amount %":"Amount Rs";q("#o_fw").hidden=t!=="free";q("#o_cw").hidden=sc!=="cats";q("#o_iw").hidden=sc!=="items"};
  fs();sync();q("#o_fi").onchange=fs;q("#o_tp").onchange=sync;q("#o_sc").onchange=sync;q("#x").onclick=close;
  const del=q("#o_del");del&&(del.onclick=()=>{if(!del.dataset.sure){del.dataset.sure=1;del.textContent="Delete for sure?";return}busy(del,async()=>{L.splice(idx,1);await DO.settings({offers:L});close();offCard();toast("Offer deleted")})});
  q("#off").onsubmit=e=>{e.preventDefault();const err=t=>q("#oerr").textContent=t;
    const x={id:o.id,name:q("#o_nm").value.trim(),on:q("#o_on2").checked,type:q("#o_tp").value,scope:q("#o_sc").value,value:+q("#o_v").value||0,minBill:+q("#o_min").value||0,
      cats:[...m.querySelectorAll("[data-oc2]")].filter(i=>i.checked).map(i=>i.dataset.oc2),items:[...m.querySelectorAll("[data-oi]")].filter(i=>i.checked).map(i=>i.dataset.oi),
      free:{id:q("#o_fi").value,size:q("#o_fs").value||null,qty:Math.max(1,+q("#o_fq").value||1)},days:[...m.querySelectorAll("[data-od]")].filter(i=>i.checked).map(i=>+i.dataset.od),
      from:q("#o_from").value,to:q("#o_to").value,start:q("#o_st").value,end:q("#o_en").value};
    if(!x.name)return err("Enter a name.");
    if(x.type!=="free"&&!(x.value>0))return err("Enter the discount amount.");
    if(x.type==="pct"&&x.value>100)return err("% cannot be more than 100.");
    if(x.type==="free"&&!x.free.id)return err("Choose the free item.");
    if(x.scope==="cats"&&!x.cats.length)return err("Choose at least one category.");
    if(x.scope==="items"&&!x.items.length)return err("Choose at least one item.");
    if(!!x.from!==!!x.to)return err("Fill both From and To time, or leave both empty.");
    if(x.start&&x.end&&x.end<x.start)return err("The end date is before the start date.");
    if(x.type!=="free")x.free=null;
    n?L.push(x):L[idx]=x;
    busy(q("#o_sv"),async()=>{try{await DO.settings({offers:L});close();offCard();renderCart&&$("#cart")&&renderCart();toast("Offer saved")}catch(e){err(e.message)}});
  };
}

/* ============ subscription screens ============ */
let PLANPOLL=null,DEFERRED=null;
async function enter(){
  clearInterval(PLANPOLL);
  let me=await api("/api/me");
  if(!me.member){if(me.admin){location.href="admin.html";return}return noBusinessScreen(me)}
  if(!me.active)return noBusinessScreen(me);
  if(me.businessStatus!=="active"){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Account disabled</h3><p class="muted">This business account has been disabled. Please contact support.</p><button class="btn" onclick="logout()">Logout</button></div></div>`;return}
  if(me.me.mustChange){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"></div></div>`;return changePwModal(true,()=>enter())}
  if(me.sub.status!=="active")return expiredScreen(me);
  await pull();startSync();$("#root").innerHTML="";render();
}
function expiryPill(){if(!S||!S.sub||!S.sub.expires)return"";const d=Math.ceil((S.sub.expires-Date.now())/864e5);const tr=S.sub.plan&&S.sub.plan.id==="trial";return tr?`<span class="pill ${d<=2?"warn":"y"}">${OFFLINE?"Offline trial":"Free trial"} · ${d} day${d==1?"":"s"} left</span>`:d<=(OFFLINE?15:5)?`<span class="pill warn">${OFFLINE?"License":"Plan"} ends in ${d} day${d==1?"":"s"}</span>`:""}
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();DEFERRED=e;document.querySelectorAll(".inst").forEach(b=>b.hidden=false)});
addEventListener("appinstalled",()=>{DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true);toast("RestoPulse installed")});
function installBtn(){return MODE==="server"&&!isStandalone()?`<button type="button" class="btn sm inst" ${DEFERRED?"":"hidden"} onclick="doInstall()">Install on computer / mobile</button>`:""}
async function doInstall(){if(!DEFERRED)return;DEFERRED.prompt();await DEFERRED.userChoice;DEFERRED=null;document.querySelectorAll(".inst").forEach(b=>b.hidden=true)}
function contactLine(c){c=String(c||"");const re=/(\+?92[-\s]?|0)3\d{2}[-\s]?\d{7}/;const wl=c.split("\n").find(l=>/whats\s*app/i.test(l)&&re.test(l));const ph=((wl||c).match(re)||[])[0];return{text:c,wa:ph?"https://wa.me/"+ph.replace(/\D/g,"").replace(/^0/,"92"):""}}
function expiredScreen(me){
  clearInterval(PLANPOLL);if(ES&&SB){SB.removeChannel(ES);ES=null}
  const sub=me.sub||{},trial=sub.plan&&sub.plan.id==="trial",d=t=>new Date(t).toLocaleDateString("en-GB"),c=contactLine(me.contact);
  if(OFFLINE){const L=sub.license||{},own=me.me.role==="owner",na=L.status==="inactive";
    $("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse">
     <h3 style="text-align:center">${na?"Activate RestoPulse":"License ended"}</h3>
     <p class="muted" style="text-align:center;margin-top:-6px">${esc(me.business.name)} · ${esc(me.me.name)}</p>
     <p style="line-height:1.7">${na?`RestoPulse is not activated on this ${TABLET?"device":"computer"} yet.`:`The RestoPulse license on this ${TABLET?"device":"computer"} ended on `+d(L.exp)+"."} All your data is safe. ${own?"Enter a license key to continue.":(TABLET?"Ask the owner to activate RestoPulse on this device.":"Ask the owner to activate RestoPulse on the counter PC.")}</p>
     ${own?`<div class="card" style="background:var(--bg)" id="exlic"></div>`:""}
     <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px"><button class="btn" id="chk">Check again</button><button class="btn" id="lo2">Logout</button></div></div></div>`;
    own&&licBox($("#exlic"),L);$("#lo2").onclick=()=>logout();$("#chk").onclick=()=>enter();return}
  $("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse">
   <h3 style="text-align:center">${trial?"Free trial ended":"Plan ended"}</h3>
   <p class="muted" style="text-align:center;margin-top:-6px">${esc(me.business.name)} · ${esc(me.me.name)}</p>
   <p style="line-height:1.7">${trial?"Your 7-day free trial":"Your plan"} ended${sub.expires?" on "+d(sub.expires):""}. All your data is safe. The software opens again as soon as payment is made.</p>
   ${me.me.role==="owner"?`<div class="card" style="background:var(--bg)"><div class="muted" style="font-size:12px;font-weight:600;margin-bottom:6px">Contact for payment and plans</div><div class="payinfo">${esc(c.text||"Contact the RestoPulse team.")}</div></div>`:`<p class="muted">Ask the owner to contact the RestoPulse team.</p>`}
   <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">${c.wa&&me.me.role==="owner"?`<a class="btn y" href="${c.wa}" target="_blank" rel="noopener">Contact on WhatsApp</a>`:""}
   <button class="btn" id="chk">Check again</button><button class="btn" id="lo2">Logout</button></div></div></div>`;
  $("#lo2").onclick=()=>logout();$("#chk").onclick=()=>enter();
  PLANPOLL=setInterval(async()=>{try{const m2=await api("/api/me");if(m2.sub&&m2.sub.status==="active"){clearInterval(PLANPOLL);toast("Account is active");enter()}}catch(e){}},30000);
}

/* ============ first login: owner sets his own password ============ */
function changePwModal(force,done){
  const m=modal(`<h2>${force?"Create your new password":"Change my password"}</h2>
   <p class="muted" style="margin-top:-6px">${force?"This is your first login. From now on only your own password will work.":"The new password must be at least 8 characters."}</p>
   <form id="cpf" style="display:flex;flex-direction:column;gap:12px">
   <label class="f">New password<input class="in" id="cp1" type="password" minlength="8" required autocomplete="new-password" autofocus></label>
   <label class="f">New password again<input class="in" id="cp2" type="password" minlength="8" required autocomplete="new-password"></label>
   <p id="cperr" style="color:var(--bad);margin:0;min-height:18px"></p>
   <div class="row" style="justify-content:flex-end">${force?`<button type="button" class="btn" id="cplo">Logout</button>`:`<button type="button" class="btn" id="x">Back</button>`}<button class="btn y" id="cpsv">Save password</button></div></form>`);
  if(force){const ov=$("#ov");ov&&(ov.dataset.lock="1");m.querySelector("#cplo").onclick=()=>logout()}else m.querySelector("#x").onclick=close;
  m.querySelector("#cpf").onsubmit=e=>{e.preventDefault();const p1=m.querySelector("#cp1").value,err=t=>m.querySelector("#cperr").textContent=t;
    if(p1!==m.querySelector("#cp2").value)return err("The two passwords do not match.");
    if(p1.length<8)return err("Password must be at least 8 characters.");
    busy(m.querySelector("#cpsv"),async()=>{try{
      if(MODE==="local"){const u=(S.users||[]).find(x=>x.id===S.me.id);if(u)u.password=p1;saveLocal()}
      else{const {error}=await SB.auth.updateUser({password:p1});if(error)throw new Error(/different from the old/i.test(error.message)?"The new password must be different from the old one.":error.message);await rpc("password_changed")}
      close(true);toast("Password changed");done&&done()}catch(x){err(x.message||String(x))}})};
}

/* ============ emailed link: verify email + get login once ============ */
function claimScreen(tok){
  $("#root").innerHTML=`<div class="auth"><div class="card" id="clc"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Verify your email</h3>
   <p class="muted" style="line-height:1.6;text-align:center">Press the button below to verify your email and see your username and password. They are shown <b>only once</b>.</p>
   <p id="clerr" style="color:var(--bad);min-height:18px;margin:0"></p>
   <div style="display:flex;flex-direction:column;gap:10px"><button class="btn y" id="clb">Verify and show my login</button><button class="btn" id="clskip">Go to login screen</button></div></div></div>`;
  const clear=()=>{try{history.replaceState(null,"",location.pathname+location.search)}catch(e){}};
  $("#clskip").onclick=()=>{clear();authScreen()};
  $("#clb").onclick=()=>busy($("#clb"),async()=>{try{const r=await rpc("claim_account",{p_token:tok});clear();
    $("#clc").innerHTML=`<img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">Email verified</h3>
     <p class="muted" style="text-align:center;margin-top:-6px">${esc(r.business)} · ${esc(r.owner)} · 7-day free trial</p>
     <div class="card" style="background:var(--bg);font-size:16px;line-height:2"><div>Username: <b class="num" style="color:var(--y)">${esc(r.username)}</b></div><div>Password: <b class="num" style="color:var(--y)">${esc(r.password)}</b></div></div>
     <p class="muted" style="font-size:12px">Note these down now. After logging in you will create your own password.</p>
     <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="clcp">Copy</button><button class="btn y" id="clgo">Log in now</button></div>`;
    $("#clcp").onclick=async()=>{(await copyText("Username: "+r.username+"\nPassword: "+r.password))?toast("Copied"):toast("Could not copy. Please write it down.",true)};
    $("#clgo").onclick=async()=>{await authScreen();const a=$("#a_login");a&&(a.value=r.username);const p=$("#a_pw");p&&p.focus()};
  }catch(x){$("#clerr").textContent=x.message||String(x)}});
}

/* ============ boot ============ */
(async()=>{
  const CFG=window.AK47_CONFIG;
  if(!inFrame&&CFG&&!window.supabase){$("#root").innerHTML=`<div class="auth"><div class="card"><img src="${LOGO}" alt="RestoPulse"><h3 style="text-align:center">${OFFLINE?"Cannot reach RestoPulse":"No internet"}</h3><p class="muted" style="line-height:1.6">${OFFLINE?"Check that this device is on the shop WiFi and RestoPulse is running on the counter PC.":"RestoPulse needs the internet. Check your connection and open it again."}</p><button class="btn y" style="width:100%" onclick="location.reload()">Try again</button></div></div>`;return}
  if(!inFrame&&CFG&&window.supabase){MODE="server";SB=window.supabase.createClient(CFG.url,CFG.key,{auth:{persistSession:true,autoRefreshToken:true,storage:AUTHSTORE}})}
  if(MODE==="server"){
    try{navigator.serviceWorker&&navigator.serviceWorker.register("./sw.js")}catch(e){}
    const cm=location.hash.match(/^#claim=([0-9a-f]{48})$/);
    if(cm){await SB.auth.signOut().catch(()=>{});return claimScreen(cm[1])}
    const {data}=await SB.auth.getSession();
    if(data.session){TOKEN="sb";try{await enter();return}catch(e){if(!TOKEN)return;$("#root").innerHTML=`<div class="auth"><div class="card"><h3>Could not connect</h3><p class="muted">${esc(e.message)}</p><button class="btn y" onclick="location.reload()">Try again</button></div></div>`;return}}
    return authScreen();
  }
  try{S=JSON.parse(ls.get(KEY)||"null")}catch(e){S=null}
  if(!S||!S.items){S=seedLocal();saveLocal()}
  if(!S.users)S.users=[{id:"u_owner",name:"Owner",login:"owner",password:"owner123",role:"owner",active:true}];
  const me=S.users.find(u=>u.id===ls.get("rp.demo.me")&&u.active);
  if(!me){S.me=null;return authScreen()}
  S.me={id:me.id,name:me.name,role:me.role};UI.role=me.role;
  render();
})();
